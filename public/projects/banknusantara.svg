<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bankBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131f" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="brutalShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bankBg)" />

  <!-- Top Application Window Bar -->
  <rect x="24" y="20" width="752" height="48" rx="12" fill="#fffdf5" stroke="#0f172a" stroke-width="2.5" filter="url(#brutalShadow)" />
  <circle cx="48" cy="44" r="6" fill="#ef4444" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="68" cy="44" r="6" fill="#fde047" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="88" cy="44" r="6" fill="#22c55e" stroke="#0f172a" stroke-width="1.5" />
  <text x="114" y="49" font-family="monospace" font-size="13" font-weight="900" fill="#0f172a">BANKNUSANTARA // CORE DIGITAL BANKING SYSTEM</text>
  
  <rect x="585" y="31" width="175" height="26" rx="6" fill="#22c55e" stroke="#0f172a" stroke-width="1.5" />
  <text x="597" y="48" font-family="monospace" font-size="10.5" font-weight="900" fill="#ffffff">SPRING BOOT + NEXT.JS</text>

  <!-- Left: Banking Dashboard / Frontend Mockup -->
  <g transform="translate(24, 82)">
    <rect width="360" height="392" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Header -->
    <rect width="360" height="42" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="26" font-family="monospace" font-size="11" font-weight="900" fill="#38bdf8">CLIENT INTERFACE // NEXT.JS 14</text>
    <rect x="270" y="10" width="76" height="22" rx="4" fill="#0284c7" />
    <text x="278" y="25" font-family="monospace" font-size="9.5" font-weight="900" fill="#ffffff">LIVE PORTAL</text>

    <!-- Digital Bank Card Widget -->
    <g transform="translate(16, 54)">
      <rect width="328" height="100" rx="12" fill="url(#cardGrad)" stroke="#0f172a" stroke-width="2" filter="url(#brutalShadow)" />
      <text x="16" y="24" font-family="monospace" font-size="10" font-weight="800" fill="#bae6fd">BANK NUSANTARA PLATINUM</text>
      <text x="16" y="52" font-family="monospace" font-size="18" font-weight="900" fill="#ffffff">Rp 128.450.000,00</text>
      <text x="16" y="72" font-family="monospace" font-size="9" font-weight="700" fill="#e0f2fe">Rekening Utama: 8802-9102-4419</text>
      <rect x="250" y="16" width="62" height="26" rx="6" fill="#fde047" stroke="#0f172a" stroke-width="1.5" />
      <text x="258" y="33" font-family="monospace" font-size="10" font-weight="900" fill="#0f172a">ACTIVE</text>
      <text x="252" y="86" font-family="monospace" font-size="9" font-weight="800" fill="#ffffff">CHIP / NFC</text>
    </g>

    <!-- Transfer & Transaction Action Bar -->
    <g transform="translate(16, 166)">
      <text x="2" y="12" font-family="monospace" font-size="10" font-weight="800" fill="#94a3b8">QUICK ACTIONS // REAL-TIME</text>
      
      <rect x="0" y="20" width="102" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="16" y="42" font-family="monospace" font-size="10" font-weight="800" fill="#38bdf8">⇄ Transfer</text>

      <rect x="112" y="20" width="102" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="124" y="42" font-family="monospace" font-size="10" font-weight="800" fill="#f8fafc">↓ Tarik Tunai</text>

      <rect x="224" y="20" width="104" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="238" y="42" font-family="monospace" font-size="10" font-weight="800" fill="#f8fafc">≡ Mutasi</text>
    </g>

    <!-- Recent Ledger Transactions -->
    <g transform="translate(16, 236)">
      <text x="2" y="12" font-family="monospace" font-size="10" font-weight="800" fill="#94a3b8">AUDIT MUTASI REKENING (REAL-TIME)</text>
      
      <g transform="translate(0, 20)">
        <rect width="328" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="10" fill="#22c55e" />
        <text x="16" y="23" font-family="monospace" font-size="11" font-weight="900" fill="#ffffff">+</text>
        <text x="38" y="17" font-family="monospace" font-size="10" font-weight="800" fill="#f8fafc">Transfer Masuk (Payroll)</text>
        <text x="38" y="30" font-family="monospace" font-size="8.5" fill="#94a3b8">12:30:14 • Ref #BN-8921</text>
        <text x="228" y="24" font-family="monospace" font-size="10.5" font-weight="900" fill="#4ade80">+Rp 15.000.000</text>
      </g>

      <g transform="translate(0, 64)">
        <rect width="328" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="10" fill="#ef4444" />
        <text x="17" y="22" font-family="monospace" font-size="11" font-weight="900" fill="#ffffff">-</text>
        <text x="38" y="17" font-family="monospace" font-size="10" font-weight="800" fill="#f8fafc">Payment Merchant QRIS</text>
        <text x="38" y="30" font-family="monospace" font-size="8.5" fill="#94a3b8">11:15:02 • Ref #BN-8920</text>
        <text x="242" y="24" font-family="monospace" font-size="10.5" font-weight="900" fill="#f87171">-Rp 350.000</text>
      </g>

      <g transform="translate(0, 108)">
        <rect width="328" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="10" fill="#3b82f6" />
        <text x="16" y="23" font-family="monospace" font-size="11" font-weight="900" fill="#ffffff">⇄</text>
        <text x="38" y="17" font-family="monospace" font-size="10" font-weight="800" fill="#f8fafc">Transfer Antar Bank (BI-FAST)</text>
        <text x="38" y="30" font-family="monospace" font-size="8.5" fill="#94a3b8">09:44:21 • Ref #BN-8919</text>
        <text x="235" y="24" font-family="monospace" font-size="10.5" font-weight="900" fill="#93c5fd">-Rp 2.500.000</text>
      </g>
    </g>
  </g>

  <!-- Right: Spring Boot Core Backend + Redis + PostgreSQL -->
  <g transform="translate(400, 82)">
    <rect width="376" height="392" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Header -->
    <rect width="376" height="42" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="26" font-family="monospace" font-size="11" font-weight="900" fill="#4ade80">BACKEND ENGINE // SPRING BOOT</text>
    <rect x="272" y="10" width="88" height="22" rx="4" fill="#16a34a" />
    <text x="279" y="25" font-family="monospace" font-size="9.5" font-weight="900" fill="#ffffff">SECURE API</text>

    <!-- Spring Boot API Service Node -->
    <g transform="translate(16, 54)">
      <rect width="344" height="74" rx="10" fill="#1e293b" stroke="#16a34a" stroke-width="1.5" />
      <rect x="12" y="12" width="60" height="20" rx="4" fill="#16a34a" />
      <text x="18" y="26" font-family="monospace" font-size="9" font-weight="900" fill="#ffffff">SERVICE</text>
      <text x="80" y="27" font-family="monospace" font-size="11" font-weight="800" fill="#f8fafc">TransferTransactionService.java</text>
      <text x="14" y="48" font-family="monospace" font-size="9.5" fill="#86efac">@Transactional(isolation = SERIALIZABLE)</text>
      <text x="14" y="62" font-family="monospace" font-size="9.5" fill="#94a3b8">Spring Security • JWT Auth • Idempotent Key</text>
      <rect x="268" y="12" width="64" height="20" rx="4" fill="#0f172a" stroke="#16a34a" />
      <text x="276" y="26" font-family="monospace" font-size="9" font-weight="900" fill="#4ade80">200 OK</text>
    </g>

    <!-- Middle: Redis High-Speed In-Memory Cache -->
    <g transform="translate(16, 138)">
      <rect width="344" height="110" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
      <rect x="12" y="12" width="106" height="22" rx="4" fill="#ef4444" />
      <text x="18" y="27" font-family="monospace" font-size="9.5" font-weight="900" fill="#ffffff">REDIS CACHE</text>
      <text x="126" y="27" font-family="monospace" font-size="10.5" font-weight="800" fill="#fca5a5">In-Memory Store (Port 6379)</text>
      
      <!-- Redis Metrics -->
      <g transform="translate(12, 42)">
        <rect width="100" height="56" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
        <text x="8" y="18" font-family="monospace" font-size="8.5" font-weight="700" fill="#94a3b8">LATENCY</text>
        <text x="8" y="38" font-family="monospace" font-size="14" font-weight="900" fill="#f87171">&lt; 3.2 ms</text>
        <text x="8" y="50" font-family="monospace" font-size="7.5" fill="#4ade80">● Real-time</text>
      </g>

      <g transform="translate(120, 42)">
        <rect width="100" height="56" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
        <text x="8" y="18" font-family="monospace" font-size="8.5" font-weight="700" fill="#94a3b8">HIT RATE</text>
        <text x="8" y="38" font-family="monospace" font-size="14" font-weight="900" fill="#fde047">99.4%</text>
        <text x="8" y="50" font-family="monospace" font-size="7.5" fill="#94a3b8">Session &amp; Token</text>
      </g>

      <g transform="translate(228, 42)">
        <rect width="104" height="56" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
        <text x="8" y="18" font-family="monospace" font-size="8.5" font-weight="700" fill="#94a3b8">RATE LIMIT</text>
        <text x="8" y="38" font-family="monospace" font-size="13" font-weight="900" fill="#38bdf8">120 req/s</text>
        <text x="8" y="50" font-family="monospace" font-size="7.5" fill="#4ade80">Anti-DDoS OK</text>
      </g>
    </g>

    <!-- Bottom: PostgreSQL Relational Database -->
    <g transform="translate(16, 258)">
      <rect width="344" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <rect x="12" y="12" width="124" height="22" rx="4" fill="#2563eb" />
      <text x="18" y="27" font-family="monospace" font-size="9.5" font-weight="900" fill="#ffffff">POSTGRESQL DB</text>
      <text x="144" y="27" font-family="monospace" font-size="10.5" font-weight="800" fill="#93c5fd">ACID Relational Core</text>

      <!-- Tables -->
      <g transform="translate(12, 42)">
        <rect width="154" height="66" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="8" y="16" font-family="monospace" font-size="9" font-weight="900" fill="#60a5fa">TABLE: accounts_cif</text>
        <text x="8" y="30" font-family="monospace" font-size="8" fill="#94a3b8">• account_no (PK, UUID)</text>
        <text x="8" y="44" font-family="monospace" font-size="8" fill="#94a3b8">• balance_amount (NUMERIC)</text>
        <text x="8" y="58" font-family="monospace" font-size="8" fill="#4ade80">✓ Row Locking Protected</text>
      </g>

      <g transform="translate(174, 42)">
        <rect width="158" height="66" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="8" y="16" font-family="monospace" font-size="9" font-weight="900" fill="#60a5fa">TABLE: ledger_audit</text>
        <text x="8" y="30" font-family="monospace" font-size="8" fill="#94a3b8">• tx_hash (VARCHAR, UNIQUE)</text>
        <text x="8" y="44" font-family="monospace" font-size="8" fill="#94a3b8">• debit_credit (IMMUTABLE)</text>
        <text x="8" y="58" font-family="monospace" font-size="8" fill="#4ade80">✓ Double-Entry Validated</text>
      </g>
    </g>
  </g>
</svg>
